name: Precision research (manual, no promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: precision-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_API_ENABLED: 'false'
      MODEL_AUTO_PROMOTE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.fetch_history
      - run: python -m ml.pipeline
      - run: python -m scripts.source_snapshot
      - run: python -m scripts.fetch_additional_history
      - run: python -m ml.expanded
      - run: python -m ml.precision.experiment
      - run: python -m scripts.verify_precision
      - run: python -m scripts.precision_diagnostics
      - run: python -m scripts.package_precision
      - run: python -m pytest -q
      - run: python -m ruff check ml scripts
      - uses: actions/upload-artifact@v4
        with:
          name: precision-review-copy
          path: |
            reports/precision-v3/
            ml/models/precision-v3-*/
          retention-days: 14
      # A temporary review copy only. Keep the reviewed versioned files/ZIP in
      # durable storage and an approved immutable Release before any promotion.
      # This workflow never deploys, publishes a Release or calls API-Football.

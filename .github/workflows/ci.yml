name: Offline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_API_ENABLED: 'false'
      MODEL_AUTO_PROMOTE: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run worker:check
      - run: npm run worker:preview:check
  checks:
    # Frozen v2 source-record IDs include Windows path separators. Keep the
    # recorded research environment; changing that protocol needs a new version.
    # The separate Linux job checks the app/Worker without retraining models.
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      LIVE_API_ENABLED: 'false'
      MODEL_AUTO_PROMOTE: 'false'
      WRANGLER_SEND_METRICS: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.fetch_history
      - run: python -m ml.pipeline
      - run: python -m scripts.source_snapshot
      - run: python -m scripts.fetch_additional_history
      - run: python -m ml.expanded
      - run: python -m scripts.crosscheck_history
      - run: python -m ml.recent_evaluate
      - run: python -m ml.market_benchmarks
      - run: python -m scripts.prepare_centre
      - run: python -m ml.precision.experiment
      - run: python -m scripts.precision_diagnostics
      - run: python -m scripts.prepare_precision --mock-clock 2026-10-25T18:00:00Z
      - run: python -m pytest -q
      - run: python -m ruff check ml scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run worker:check
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - run: npm run db:seed:selection:local
      - run: npm run db:seed:centre:local
      - run: npm run db:seed:precision:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

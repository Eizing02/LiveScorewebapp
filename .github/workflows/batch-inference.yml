name: Batch prediction
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
permissions:
  contents: read
concurrency:
  group: batch-inference
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m ml.batch
      - run: python -m scripts.service_client /internal/features/export
      - run: python -m scripts.service_client /internal/predictions/import --body-file reports/batch-predictions.json
      # Both service_client commands are dry-run. No secret or network is used.
      # Live feature export/import must be separately authorized, use a protected environment,
      # an approved active model, scoped secrets, verified provider mappings, paging, and fresh features.

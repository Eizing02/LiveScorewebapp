name: Historical candidate training
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1,15 * *'
permissions:
  contents: read
concurrency:
  group: candidate-training
  cancel-in-progress: false
jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.fetch_history
      - run: python -m ml.pipeline
      - run: python -m pytest -q
      - run: python -m ml.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-review-only
          path: |
            reports/
            ml/models/
          retention-days: 14
      # This artifact is review evidence, never the sole permanent champion store.
      # Review and retain the immutable candidate in source/Release through the separate approved workflow.

name: Recent five-year research (manual, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recent-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_API_ENABLED: 'false'
      MODEL_AUTO_PROMOTE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.fetch_history
      - run: python -m scripts.source_snapshot
      - run: python -m scripts.fetch_additional_history
      - run: python -m ml.expanded
      - run: python -m scripts.crosscheck_history
      - run: python -m ml.recent_evaluate
      - run: python -m ml.market_benchmarks
      - run: python -m scripts.prepare_centre
      - run: python -m scripts.package_recent_model
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: recent-research-review-copy
          path: |
            reports/recent-v2/
            reports/recent-v2-quality.json
            reports/recent-v2-reference-crosscheck.json
            ml/models/recent-v2-*/
          retention-days: 14
      # Review copy only. Keep reviewed model files in version control and an
      # explicitly approved immutable Release; this workflow never promotes or deploys.

name: Managed live research (explicitly approved, no deployment)
on:
  workflow_dispatch:
    inputs:
      execute_remote:
        description: Authorize private research data collection and signed import to the already approved Worker
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '17 0,6,11,14,16,18,19,20 * * *'
permissions:
  contents: read
concurrency:
  group: managed-live-research
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && !inputs.execute_remote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.live_sync --refresh --enrich --import-results
  approved_research:
    if: vars.LIVE_RESEARCH_CLOUD_APPROVED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.execute_remote) || (github.event_name == 'schedule' && vars.AUTOMATION_ENABLED == 'true'))
    environment: live-research
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_API_ENABLED: 'false'
      MODEL_AUTO_PROMOTE: 'false'
      PROVIDER_BROKER_ENABLED: 'true'
      REMOTE_RESEARCH_IMPORT_APPROVED: 'true'
      PROVIDER_BROKER_URL: ${{ secrets.LIVE_RESEARCH_WORKER_URL }}
      INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m scripts.fetch_history
      - run: python -m scripts.source_snapshot
      - run: python -m scripts.fetch_additional_history
      - run: python -m ml.expanded
      - run: python -m scripts.live_sync --execute --approved-remote --hydrate --refresh --enrich --archive-finished --import-results
      - run: python -m ml.live.challengers --check-only
      - uses: actions/upload-artifact@v4
        with:
          name: live-research-review-report
          path: |
            reports/live-research/implementation.json
            reports/live-research/prospective-evaluation.json
            reports/live-research/challenger-training.json
          retention-days: 14
      # Source observations/predictions persist in the approved D1 archive.
      # No API raw data or keys are uploaded. These are review reports only.
      # Training waits for an approved durable model store; no release, promotion
      # or deployment is performed by this workflow. Configure required reviewers.
